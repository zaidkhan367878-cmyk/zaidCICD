name: Build Push Deploy

on:
  push:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Set Image Tag
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/helloworld:${{ env.TAG }} .

      - name: Push Docker Image
        run: |
          docker push \
          ${{ secrets.DOCKER_USERNAME }}/helloworld:${{ env.TAG }}

      - name: Clone Helm Repo
        run: |
          git clone \
          https://github.com/zaidkhan367878-cmyk/zaidCICDConfig.git

      - name: Update Helm Values
        run: |

          cd zaidCICDConfig/helloworld-chart

          sed -i "s/tag:.*/tag: ${TAG}/" values.yaml

      - name: Install OpenShift CLI
        run: |

          curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/latest/openshift-client-linux.tar.gz

          tar -xvf openshift-client-linux.tar.gz

          sudo mv oc /usr/local/bin/

      - name: Login OpenShift
        run: |
          oc login \
          --token=${{ secrets.OCP_TOKEN }} \
          --server=${{ secrets.OCP_SERVER }}

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Helm Deploy
        run: |

          helm upgrade --install helloworld \
          ./zaidCICDConfig/helloworld-chart \
          -n zaidkhan367878-dev
